locale: th
name: "ซูโดกุ — รายวันและฝึก"
subtitle: "ตรรกะเงียบๆ บน iPhone และ Mac"
promotional_text: |-
  ปริศนาใหม่สามข้อทุกวันเวลา 00:00 UTC สานต่อเกมระหว่าง iPhone และ Mac โดยอัตโนมัติ โฆษณา? ซื้อครั้งเดียวลบได้ถาวร
description: |-
  ซูโดกุ แบบไม่เร่งรีบ

  ทุกเที่ยงคืนจะมีปริศนาใหม่สามข้อมาถึง — ง่าย ปานกลาง ยาก ชุดเดียวกันทั่วโลก ไขตามจังหวะของคุณเอง กระดานอันดับอยู่ตรงนั้นถ้าอยากรู้ว่าเทียบกับคนอื่นเป็นอย่างไร และเพิกเฉยได้ง่ายถ้าไม่สนใจ

  อยากลืมนาฬิกาไปเลยไหม สลับไปโหมด Practice ได้ เลือกระดับความยาก รับกระดานใหม่ ไม่มีอะไรต้องส่ง ไม่มีอะไรต้องพิสูจน์ — มีแค่คุณกับตาราง

  หนึ่งวันกับซูโดกุ

  • Daily: สามระดับความยาก กระดานอันดับที่รีเซ็ตเวลาเที่ยงคืน UTC ปริศนาเดียวกันคิดคะแนนได้ครั้งเดียว
  • Practice: กระดานสุ่มได้มากเท่าที่ต้องการ ไม่มีคะแนน ไม่มีความกดดัน
  • โน้ตดินสอ: ใส่ตัวเลขที่เป็นไปได้ในช่องเดียวกันได้ถึงเก้าตัว เหมือนเขียนบนกระดาษ
  • จับข้อผิดพลาดได้ทันทีที่ใส่ผิด ไม่ต้องรอจนกระดานเต็ม
  • ย้อนกลับได้ยี่สิบขั้น พลาดครั้งเดียวไม่ทำให้ปริศนาจบ
  • เล่นต่อจากจุดเดิมได้เลย — บันทึกอัตโนมัติ และหน้าหลักก็จำได้
  • ความสำเร็จ Game Center สิบเอ็ดอย่างและกระดานอันดับรายวันสามรายการ ถ้าคุณสนใจเรื่องนี้

  ลบแบนเนอร์โฆษณาได้ด้วยการซื้อครั้งเดียว — ไม่มีการสมัครสมาชิก แล้วปริศนาที่เริ่มบนมือถือก็รอให้ไปเล่นต่อบน Mac
keywords: "sudoku,ปริศนา,ตรรกะ,สมอง,ตัวเลข,ออฟไลน์,ipad,mac,ปริศนาตัวเลข,เกมตรรกะ,รายวัน,ต่อเนื่อง"
whats_new: |-
  เวอร์ชัน 2.6

  ปริศนารายวัน กระดานอันดับ ความสำเร็จ — และเงียบกว่าเดิม

  • โหมด Daily — ปริศนาใหม่สามข้อทุกวัน 00:00 UTC (ง่าย/กลาง/ยาก) ชุดเดียวกันทั่วโลก
  • Game Center — กระดานอันดับรายวันสามรายการและความสำเร็จแปดอย่าง รวม 500 คะแนน ลงชื่อเข้าใช้หรือไม่ก็ได้
  • เล่นต่อได้ทุกเมื่อ — บันทึกอัตโนมัติ แตะครั้งเดียวจากหน้าหลักเพื่อเล่นต่อ
  • ลบโฆษณา — การซื้อครั้งเดียวแบบไม่สิ้นเปลือง ลบแบนเนอร์ทุกที่อย่างถาวร รองรับ Family Sharing

  ความเป็นส่วนตัวยังคงเป็นอย่างที่ควรเป็น ไม่มี analytics ของเราเอง โฆษณาปรับให้ตรงเฉพาะเมื่อคุณอนุญาต — ปฏิเสธหรือลบออกก็ได้

  ขอบคุณที่เล่น แจ้งปัญหาหรือข้อเสนอแนะได้ที่ลิงก์สนับสนุน
