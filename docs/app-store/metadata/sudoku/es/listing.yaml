locale: es
name: "Sudoku — Diario y Práctica"
subtitle: "Lógica serena en iPhone y Mac"
promotional_text: |-
  Tres puzles nuevos cada día a las 00:00 UTC. Retoma la partida entre iPhone y Mac. ¿Anuncios? Una compra los quita para siempre.
description: |-
  Sudoku, sin prisas.

  Cada medianoche llegan tres puzles nuevos — fácil, medio, difícil, los mismos para todo el mundo. Resuelve a tu ritmo; el ranking está ahí si quieres saber cómo te comparas, y es fácil de ignorar si no.

  ¿Quieres olvidarte del reloj por completo? Cambia a Práctica. Elige una dificultad, recibe un tablero nuevo, y no hay nada que enviar ni nada que demostrar — solo tú y la cuadrícula.

  Un día con Sudoku

  • Diario: tres dificultades, un ranking que se reinicia a medianoche UTC, una sola puntuación por puzle.
  • Práctica: tantos tableros aleatorios como quieras, sin puntuaciones, sin presión.
  • Notas a lápiz: hasta nueve candidatos por celda, escritos como los escribirías en papel.
  • Detecta los errores en cuanto los cometes, no después de rellenar todo el tablero.
  • Veinte pasos de deshacer, para que un error nunca sea el final del puzle.
  • Retoma justo donde lo dejaste — el guardado es automático y la pantalla principal lo recuerda.
  • Once logros de Game Center y tres rankings diarios, si te va ese rollo.

  El banner se puede quitar con una sola compra única — sin suscripción. Y el puzle que empiezas en tu móvil te espera en el Mac.
keywords: "puzle,logica,cerebro,numeros,offline,ipad,mac,notas,rompecabezas,sudoko,clasico,diario,racha"
whats_new: |-
  Versión 2.6

  Puzles diarios, rankings, logros — y más serena que nunca.

  • Modo Diario — tres puzles nuevos cada día a las 00:00 UTC (Fácil/Medio/Difícil), los mismos para todos.
  • Game Center — tres rankings diarios y ocho logros, 500 puntos en total. Inicio de sesión opcional.
  • Continúa donde lo dejaste — guardado automático; un toque en la pantalla principal para retomarlo.
  • Quitar anuncios — una compra única, no consumible, elimina el banner en todas partes. Compartir en Familia incluido.

  La privacidad sigue siendo como debe ser: sin analítica propia, los anuncios solo se adaptan con tu permiso — o quítalos.

  Gracias por jugar. Comentarios y errores son bienvenidos en el enlace de soporte.
