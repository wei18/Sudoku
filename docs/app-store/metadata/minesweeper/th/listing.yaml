whats_new: |-
  เวอร์ชัน 1.0

  เปิดตัวครั้งแรก

  • เก็บกู้ระเบิดคลาสสิก ระดับเริ่มต้น กลาง ผู้เชี่ยวชาญ การแตะครั้งแรกปลอดภัยเสมอ
  • โหมด Daily: ทุกวัน 00:00 UTC สามข้อ พร้อมกระดานอันดับ Game Center
  • ลบโฆษณา: การซื้อครั้งเดียวแบบไม่สิ้นเปลือง ลบแบนเนอร์ถาวร รองรับ Family Sharing
  • iCloud ซิงค์: ข้อมูลอยู่ในฐานข้อมูลส่วนตัว iCloud ของคุณเอง
  • เจ็ดภาษา อังกฤษ จีนตัวเต็ม ญี่ปุ่น จีนตัวย่อ สเปน ไทย เกาหลี
  • เวอร์ชันเนทีฟของ Mac ไม่ใช่ Catalyst

  ขอบคุณที่เล่น ปัญหาและข้อเสนอแนะยินดีรับที่ลิงก์ฝ่ายสนับสนุน
