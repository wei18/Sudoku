locale: en-US
name: "Sudoku — Daily & Practice"
subtitle: "Calm logic for iPhone & Mac"
promotional_text: |-
  Three new Daily puzzles every day at midnight UTC. Pick up where you left off across iPhone and Mac. Ads? One purchase removes them for good.
description: |-
  Sudoku, the unhurried way.

  Every midnight, three new puzzles arrive — easy, medium, hard, the same three for the whole world. Solve at your pace; the leaderboard is there if you want to know how you compared, and easy to ignore if you don't.

  Want to skip the clock entirely? Switch to Practice. Pick a difficulty, get a fresh board, and there's nothing to submit, nothing to live up to — just you and the grid.

  A day with Sudoku

  • Daily — three difficulties, a leaderboard that resets at midnight UTC, one scoring attempt per puzzle.
  • Practice — as many random boards as you want, no scores, no pressure.
  • Pencil notes — up to nine candidates a cell, written the way you'd write them on paper.
  • Catches mistakes as you make them, not after you've filled the whole board.
  • Twenty steps of undo, so a wrong guess is never the end of the puzzle.
  • Pick up exactly where you left off — saves are automatic, and the home screen remembers.
  • Eight Game Center achievements and three daily leaderboards, 500 points total, if you're into that.

  The banner ad can be removed with a single one-time purchase — no subscription. And a puzzle you start on your phone is waiting on your Mac.
keywords: "puzzle,logic,brain,number,offline,ipad,mac,pencil,notes,sudoko,solver,board,classic,daily,streak"
whats_new: |-
  Version 2.6

  Daily puzzles, leaderboards, achievements — and quieter than ever.

  • Daily mode — three new puzzles every day at midnight UTC (Easy / Medium / Hard), the same set for every player worldwide.
  • Game Center — three recurring daily leaderboards and eight achievements, 500 points total. Sign-in optional.
  • Resume any time — saves are automatic; one tap from the home screen picks up where you left off.
  • Remove Ads — a one-time, non-consumable purchase removes the banner everywhere, forever. Family Sharing included.

  Privacy stays the way it should be: no first-party analytics, no profile built on you. Ads tailor only with your permission — or remove them entirely.

  Thank you for playing. Issues and feature requests are welcome at the support link.
