locale: th-TH
name: "เก็บกู้ระเบิด — คลาสสิก"
subtitle: "ตรรกะสะอาดบน iPhone และ Mac"
promotional_text: |-
  แตะแรกปลอดภัยเสมอ—ไม่ต้องแพ้ตั้งแต่ตาแรกอีกต่อไป ระดับเริ่มต้น กลาง และผู้เชี่ยวชาญ เราไม่สร้างโปรไฟล์ของคุณ โฆษณาปรับให้ตรงเฉพาะเมื่อคุณอนุญาต ปฏิเสธหรือลบออกก็ได้
description: |-
  เก็บกู้ระเบิด แบบไม่เร่งรีบ

  กติกาที่คุณรู้อยู่แล้ว — แต่การแตะครั้งแรกปลอดภัยเสมอ จึงไม่มีทางแพ้ตั้งแต่ตาแรก ทุกเที่ยงคืนจะมีกระดานใหม่สามชุดมาถึง — เริ่มต้น กลาง ผู้เชี่ยวชาญ ชุดเดียวกันทั่วโลก เคลียร์ตามจังหวะของคุณเอง กระดานอันดับอยู่ตรงนั้นถ้าอยากรู้ว่าเทียบกับคนอื่นเป็นอย่างไร และเพิกเฉยได้ง่ายถ้าไม่สนใจ

  อยากลืมนาฬิกาไปเลยไหม เล่นระดับความยากคลาสสิกทั้งสามได้ทุกเมื่อ เลือกหนึ่งระดับ รับกระดานใหม่ ไม่มีอะไรต้องส่ง ไม่มีอะไรต้องพิสูจน์ — มีแค่คุณกับระเบิด

  หนึ่งวันกับเก็บกู้ระเบิด

  • Daily: สามระดับความยาก กระดานอันดับที่รีเซ็ตเวลาเที่ยงคืน UTC กระดานเดียวกันคิดคะแนนได้ครั้งเดียว
  • คลาสสิก: เริ่มต้น (9×9 ระเบิด 10 ลูก) กลาง (16×16 ระเบิด 40 ลูก) ผู้เชี่ยวชาญ (16×30 ระเบิด 99 ลูก) เล่นได้ทุกเมื่อ ไม่มีคะแนน
  • ความปลอดภัยของการแตะครั้งแรก: ช่องที่เปิดก่อนและช่องรอบ ๆ ไม่มีทางเป็นระเบิด
  • แตะเพื่อเปิด กดค้างเพื่อปักธง — คลิกขวาหรือ control-คลิกบน Mac
  • เล่นต่อจากจุดเดิมได้เลย — บันทึกอัตโนมัติ และหน้าหลักก็จำได้
  • ความสำเร็จ Game Center สิบเอ็ดอย่างและกระดานอันดับรายวันสามรายการ ถ้าคุณสนใจเรื่องนี้

  หนึ่งแอป สองแพลตฟอร์มของจริง

  โค้ดชุดเดียวกัน ใส่ใจเท่ากันทั้งสองฝั่ง เวอร์ชัน Mac เป็นแอป SwiftUI สำหรับ Mac แท้ ๆ — ไม่ใช่ iPad บน Mac ไม่ใช่ Catalyst — ปรับขนาดหน้าต่างและปักธงด้วยคลิกขวาทำงานตามที่คุณคาดหวังทุกอย่าง เริ่มเล่นบนมือถือระหว่างนั่งรถไฟ แล้วไปเคลียร์ต่อบน Mac ที่โต๊ะทำงาน

  เรื่องความเป็นส่วนตัว พูดตรง ๆ

  ไม่มี analytics ของเราเอง ไม่มี CRM ไม่มีเซิร์ฟเวอร์ของเราเอง—ฝั่งเราไม่สร้างโปรไฟล์ของคุณ ข้อมูลของคุณอยู่ในฐานข้อมูลส่วนตัว iCloud ของคุณเอง คุณเห็นได้ เราไม่เห็น SDK ของบุคคลที่สามมีเพียงไลบรารีแบนเนอร์โฆษณาของ Google เมื่อคุณอนุญาต อาจใช้ตัวระบุโฆษณาเพื่อให้โฆษณายังตรงกับคุณ—ปฏิเสธได้ โฆษณายังแสดงอยู่เพียงแต่ตรงกับคุณน้อยลง หรือลบแบนเนอร์ออกถาวรด้วยการซื้อในแอปครั้งเดียว

  ลบโฆษณา

  ซื้อครั้งเดียว ไม่มีการสมัครสมาชิก ลบแบนเนอร์ทุกที่อย่างถาวร รองรับ Family Sharing

  เจ็ดภาษา ทำอย่างจริงจัง

  จีนตัวเต็ม อังกฤษ จีนตัวย่อ ญี่ปุ่น เกาหลี สเปน และไทย — ครอบคลุมอินเทอร์เฟซ Game Center และหน้าสโตร์นี้ ทั้งหมด

  ออกแบบมาให้ใช้งานได้จริง

  Dynamic Type ครอบคลุม VoiceOver เต็มรูปแบบ โหมดสว่างและมืด และโทนสีเซจกรีนกับกระดาษอุ่นที่มองได้นาน ๆ แบบไม่ล้า

  ต้องใช้ iOS 26 หรือ macOS 26 ขึ้นไป
