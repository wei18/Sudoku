whats_new: |-
  เวอร์ชัน 2.6

  ปริศนารายวัน กระดานอันดับ ความสำเร็จ — และเงียบกว่าเดิม

  • โหมด Daily — ปริศนาใหม่สามข้อทุกวัน 00:00 UTC (ง่าย/กลาง/ยาก) ชุดเดียวกันทั่วโลก
  • Game Center — กระดานอันดับรายวันสามรายการและความสำเร็จแปดอย่าง รวม 500 คะแนน ลงชื่อเข้าใช้หรือไม่ก็ได้
  • เล่นต่อได้ทุกเมื่อ — บันทึกอัตโนมัติ แตะครั้งเดียวจากหน้าหลักเพื่อเล่นต่อ
  • ลบโฆษณา — การซื้อครั้งเดียวแบบไม่สิ้นเปลือง ลบแบนเนอร์ทุกที่อย่างถาวร รองรับ Family Sharing

  ความเป็นส่วนตัวยังคงเป็นอย่างที่ควรเป็น ไม่มี analytics ของเราเอง โฆษณาปรับให้ตรงเฉพาะเมื่อคุณอนุญาต — ปฏิเสธหรือลบออกก็ได้

  ขอบคุณที่เล่น แจ้งปัญหาหรือข้อเสนอแนะได้ที่ลิงก์สนับสนุน
