name: "マインスイーパ — クラシック"
subtitle: "iPhoneとMacの静かな論理"
promotional_text: |-
  最初のタップは必ず安全——初手で負けることはもうない。初級・中級・上級。広告は？一回の購入で永久に消せます。
description: |-
  マインスイーパを、自分のペースで。

  ルールはご存じのとおり——でも最初の一手は必ず安全だから、初手で負けることはない。毎晩、新しい3枚の盤面が届く——初級・中級・上級、世界中で同じ3枚。自分のペースで解けばいい。リーダーボードは、比べたければそこにあるし、興味がなければ気にしなくていい。

  時計を完全に忘れたい？クラシックな3段階はいつでも遊べる。難易度を選んで新しい盤面を1枚——提出するものは何もなく、誰かに証明する必要もない。ただ盤面と向き合うだけ。

  マインスイーパと過ごす一日

  • Daily：3つの難易度、UTC 00:00にリセットされるリーダーボード、1盤面1回の計測。
  • クラシック：初級（9×9、地雷10個）・中級（16×16、40個）・上級（16×30、99個）、いつでも、スコアなしで。
  • 初手の安全：最初にタップしたマスとその周囲は、絶対に地雷ではない。
  • タップで開く、長押しで旗（Macでは右クリックまたはcontrolクリック）。
  • 続きから、そのまま——自動セーブ、ホーム画面も覚えている。
  • Game Centerの実績11個とデイリーリーダーボード3つ。集めたい人向け。

  バナー広告は一回の買い切りで削除できます——サブスクではありません。スマホで始めた盤面は、Macでも続きから遊べます。
keywords: "マインスイーパー,地雷,ロジック,パズル,クラシック,頭脳,オフライン,ipad,mac,旗,数字,爆弾,マイン,パズルゲーム,地雷ゲーム"
whats_new: |-
  バージョン1.0

  初リリース。

  • クラシックなマインスイーパ：初級・中級・上級。最初のタップは必ず安全。
  • デイリーモード：毎日UTC 00:00に3問、Game Centerリーダーボード付き。
  • 広告を非表示：非消耗型の1回購入でバナーを永久削除。ファミリー共有対応。
  • iCloud同期：データは自分のiCloudプライベートデータベースに。
  • 7言語対応：日本語、英語、繁体字、簡体字、スペイン語、タイ語、韓国語。
  • Macネイティブ。Catalystではない。

  遊んでいただきありがとうございます。不具合や要望はサポートリンクまで。
