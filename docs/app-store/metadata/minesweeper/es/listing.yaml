description: |-
  Buscaminas, sin prisas. Las reglas que ya conoces — pero el primer toque siempre es seguro, así que nunca pierdes en la primera jugada.

  Qué incluye

  • Tres dificultades clásicas: Principiante, Intermedio, Experto.
  • Seguridad en el primer toque: la jugada inicial nunca pierde.
  • Toca para revelar, mantén pulsado para marcar (clic derecho o control-clic en Mac).
  • Modo Diario: tres dificultades cada día, rankings recurrentes que resetean a las 00:00 UTC.
  • Tres rankings diarios de Game Center (Principiante / Intermedio / Experto). Inicio de sesión opcional.

  Realmente multiplataforma

  Una sola base de código, dos plataformas. La versión de Mac es una app de Mac SwiftUI de verdad, no iPad en Mac ni Catalyst. Cambiar el tamaño de la ventana y marcar con clic derecho funcionan como esperan los usuarios de Mac. Juega en el dispositivo que tengas cerca.

  Privacidad, en palabras claras

  Sin analítica propia. Sin CRM. Sin servidor propio: nada nuestro te perfila. Tus datos están en tu propia base de datos privada de iCloud, visibles para ti, no para nosotros. El único SDK de terceros es la biblioteca de banners de Google; con tu permiso, puede usar un identificador de publicidad para mantener los anuncios relevantes — recházalo y los anuncios seguirán apareciendo, solo que menos personalizados, o quita el banner para siempre con una sola compra.

  Quitar anuncios

  Una compra única, no consumible, quita el banner en todas partes, para siempre. Compartir en Familia incluido.

  Siete idiomas

  Inglés, chino tradicional, japonés, chino simplificado, español, tailandés y coreano.

  Accesibilidad

  Dynamic Type, VoiceOver, modo claro y oscuro.

  Requiere iOS 26 o macOS 26.
