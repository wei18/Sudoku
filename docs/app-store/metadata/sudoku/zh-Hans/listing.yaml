name: "数独 — 每日与练习"
subtitle: "iPhone 与 Mac 的安静逻辑"
promotional_text: |-
  每天 UTC 00:00 三道新题（简单／中等／困难）。iPhone、Mac 同一个 iCloud 账号自动接续进度。我们不做第一方画像；广告只在你同意下保持相关性——可拒绝，也可一次购买永久移除。
description: |-
  数独，留一点时间给自己。

  每天午夜，三道新题准时出现——简单、中等、困难，全球玩家拿到的都一样。照自己的步调解，排行榜想看就看，不看也没关系。

  想完全甩开时钟？切到 Practice。挑个难度、拿一块新题，没有要交的东西，也没有要对得起谁——就你和格子。

  跟数独一起的一天

  • Daily：三种难度、UTC 00:00 重置的排行榜、同一题只有一次计分机会。
  • Practice：想抽多少新题就抽多少，不计分，没压力。
  • 铅笔笔记：每格最多九个候选数字，跟纸笔写法一样。
  • 填错的当下就抓出来，不用等到整盘填完才发现。
  • 二十步 Undo，猜错一次不代表这盘就毁了。
  • 接着上次的地方继续——自动存档，首页也记得。
  • 八个 Game Center 成就、三条每日排行榜，共 500 点，喜欢收集的话。

  一个 App，真正的两个平台

  同一份代码，同样用心做，两边都是。Mac 版本是货真价实的 SwiftUI Mac App——不是 iPad-on-Mac，也不是 Catalyst——所以窗口缩放、方向键与数字键输入、⌘Z Undo，全都照你的预期运作。在地铁上用手机开了头，回到书桌用 Mac 接着解完。

  关于隐私，说白了

  我们不做第一方 analytics——我们这边不会建立关于你的画像。存档放在你自己的 iCloud Private Database，你看得到，我们看不到。Game Center 分数由 Apple 处理。唯一的第三方 SDK 是 Google 的横幅广告库；在你同意之下，它可能会使用广告标识符让广告保持相关性——你可以拒绝，广告仍会显示，只是不那么贴近你，也可以用一次购买把横幅永久移除。

  移除广告

  一次性购买，没有订阅。永久移除所有横幅，含家庭共享。

  七种语言，认真做好

  繁体中文、英文、简体中文、日文、韩文、西班牙文、泰文——界面、Game Center、这份商店页面，全都是。

  用得住，才是重点

  Dynamic Type、完整 VoiceOver、明暗模式，还有能让你久待也不腻的 sage 绿与暖纸色调。

  需要 iOS 26 或 macOS 26 以上。
