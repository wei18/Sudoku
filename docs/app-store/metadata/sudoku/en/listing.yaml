  • Daily mode — three new puzzles every day at midnight UTC (Easy / Medium / Hard), the same set for every player worldwide.
  • Game Center — three recurring daily leaderboards and eight achievements, 500 points total. Sign-in optional.
  • Resume any time — saves are automatic; one tap from the home screen picks up where you left off.
  • Remove Ads — a one-time, non-consumable purchase removes the banner everywhere, forever. Family Sharing included.

  Privacy stays the way it should be: no first-party analytics, no profile built on you. Ads tailor only with your permission — or remove them entirely.

  Thank you for playing. Issues and feature requests are welcome at the support link.
