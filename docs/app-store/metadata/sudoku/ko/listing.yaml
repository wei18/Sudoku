name: "스도쿠 — 데일리와 연습"
subtitle: "iPhone과 Mac을 위한 조용한 논리"
promotional_text: |-
  매일 UTC 00:00에 새 퍼즐 세 개(쉬움/보통/어려움). iPhone과 Mac이 같은 iCloud 계정이면 진행 상황이 자동으로 이어져요. 우리는 프로파일을 만들지 않아요. 광고는 당신이 허락할 때만 맞춤화되고, 거부하거나 아예 없앨 수 있어요.
description: |-
  스도쿠, 서두르지 않는 방식으로.

  매일 자정, 새로운 세 문제가 도착합니다 — 쉬움, 보통, 어려움, 전 세계가 똑같은 세 문제. 당신의 속도로 풀면 됩니다. 다른 사람과 비교하고 싶다면 리더보드가 있고, 관심 없다면 무시해도 좋습니다.

  시계를 아예 잊고 싶다면? Practice로 전환하세요. 난이도를 고르고 새 보드를 받으면, 제출할 것도 증명할 것도 없어요 — 그냥 당신과 격자뿐이에요.

  스도쿠와 함께하는 하루

  • Daily: 세 가지 난이도, UTC 00:00에 리셋되는 리더보드, 같은 퍼즐은 한 번만 점수에 반영돼요.
  • Practice: 원하는 만큼 무작위 보드를, 점수도 부담도 없이.
  • 연필 메모: 한 칸에 후보 숫자 아홉 개까지, 종이에 적던 방식 그대로예요.
  • 잘못 입력한 순간 바로 알려줘요, 다 채운 뒤가 아니라.
  • 스무 단계 되돌리기 — 한 번의 실수가 퍼즐 전체를 망치지 않아요.
  • 멈춘 곳에서 그대로 이어서 — 자동 저장되고, 홈 화면도 기억해요.
  • Game Center 도전 과제 여덟 개와 데일리 리더보드 세 개, 합쳐서 500점. 관심 있다면요.

  하나의 앱, 진짜 두 플랫폼

  같은 코드, 같은 정성으로 두 플랫폼 모두 만들었어요. Mac 버전은 진짜 SwiftUI Mac 앱이에요 — iPad on Mac도 아니고 Catalyst도 아니에요. 창 크기 조절, 화살표와 숫자 키 입력, ⌘Z 되돌리기까지 전부 기대하는 대로 동작해요. 지하철에서 폰으로 시작하고, 책상에서 Mac으로 마저 풀어요.

  개인정보, 솔직하게

  자체 분석은 없어요——우리 쪽에서 당신의 프로파일을 만들지 않아요. 저장 데이터는 당신의 iCloud Private Database 안에 있어요, 당신만 볼 수 있고 우리는 볼 수 없어요. Game Center 점수는 Apple이 처리해요. 서드파티 SDK는 Google의 배너 광고 라이브러리 하나뿐인데, 당신이 허락할 때만 광고를 관련성 있게 유지하려고 광고 식별자를 쓸 수 있어요——거부해도 광고는 계속 나오고(맞춤도가 낮아질 뿐), 한 번의 인앱 구매로 배너를 영구히 없앨 수도 있어요.

  광고 제거

  한 번 구매, 구독 아니에요. 모든 배너를 영구히 없애요. 가족 공유 지원.

  일곱 가지 언어, 제대로

  번체 중국어, 영어, 간체 중국어, 일본어, 한국어, 스페인어, 태국어 — 인터페이스, Game Center, 이 스토어 페이지까지 전부요.

  매일 써도 편하게

  Dynamic Type, VoiceOver 전체 지원, 라이트/다크 모드, 오래 봐도 편안한 세이지 그린과 따뜻한 종이 톤 팔레트.

  iOS 26 또는 macOS 26 이상이 필요해요.
keywords: "sudoku,퍼즐,논리,두뇌,숫자,오프라인,ipad,mac,메모,논리퍼즐,숫자게임,두뇌게임,숫자퍼즐,스도쿠게임,데일리,연속"
whats_new: |-
  버전 2.6

  데일리 퍼즐, 리더보드, 도전 과제 — 그리고 더 조용하게.

  • Daily 모드 — 매일 UTC 00:00에 새 퍼즐 세 개(쉬움/보통/어려움), 전 세계 동일.
  • Game Center — 데일리 리더보드 세 개와 도전 과제 여덟 개, 합쳐서 500점. 로그인 선택.
  • 언제든 이어 하기 — 자동 저장, 홈 화면에서 한 번 탭으로 이어요.
  • 광고 제거 — 비소모성 일회성 구매로 배너를 영구히 없애요. 가족 공유 지원.

  개인정보는 마땅히 그래야 할 모습 그대로예요. 자체 분석 없고, 광고는 허락할 때만 맞춤화 — 거부할 수도 있어요.

  플레이해 줘서 고마워요. 문제와 의견은 지원 링크로 알려주세요.
