locale: th
name: "ซูโดกุ — รายวันและฝึก"
subtitle: "ตรรกะเงียบๆ บน iPhone และ Mac"
promotional_text: |-
  ปริศนาใหม่สามข้อทุกวันเวลา 00:00 UTC สานต่อเกมระหว่าง iPhone และ Mac โดยอัตโนมัติ เราไม่สร้างโปรไฟล์ของคุณ โฆษณาปรับให้ตรงเฉพาะเมื่อคุณอนุญาต ปฏิเสธหรือลบออกก็ได้
description: |-
  ซูโดกุ แบบไม่เร่งรีบ

  ทุกเที่ยงคืนจะมีปริศนาใหม่สามข้อมาถึง — ง่าย ปานกลาง ยาก ชุดเดียวกันทั่วโลก ไขตามจังหวะของคุณเอง กระดานอันดับอยู่ตรงนั้นถ้าอยากรู้ว่าเทียบกับคนอื่นเป็นอย่างไร และเพิกเฉยได้ง่ายถ้าไม่สนใจ

  อยากลืมนาฬิกาไปเลยไหม สลับไปโหมด Practice ได้ เลือกระดับความยาก รับกระดานใหม่ ไม่มีอะไรต้องส่ง ไม่มีอะไรต้องพิสูจน์ — มีแค่คุณกับตาราง

  หนึ่งวันกับซูโดกุ

  • Daily: สามระดับความยาก กระดานอันดับที่รีเซ็ตเวลาเที่ยงคืน UTC ปริศนาเดียวกันคิดคะแนนได้ครั้งเดียว
  • Practice: กระดานสุ่มได้มากเท่าที่ต้องการ ไม่มีคะแนน ไม่มีความกดดัน
  • โน้ตดินสอ: ใส่ตัวเลขที่เป็นไปได้ในช่องเดียวกันได้ถึงเก้าตัว เหมือนเขียนบนกระดาษ
  • จับข้อผิดพลาดได้ทันทีที่ใส่ผิด ไม่ต้องรอจนกระดานเต็ม
  • ย้อนกลับได้ยี่สิบขั้น พลาดครั้งเดียวไม่ทำให้ปริศนาจบ
  • เล่นต่อจากจุดเดิมได้เลย — บันทึกอัตโนมัติ และหน้าหลักก็จำได้
  • ความสำเร็จ Game Center แปดอย่างและกระดานอันดับรายวันสามรายการ รวม 500 คะแนน ถ้าคุณสนใจเรื่องนี้

  หนึ่งแอป สองแพลตฟอร์มของจริง

  โค้ดชุดเดียวกัน ใส่ใจเท่ากันทั้งสองฝั่ง เวอร์ชัน Mac เป็นแอป SwiftUI สำหรับ Mac แท้ ๆ — ไม่ใช่ iPad บน Mac ไม่ใช่ Catalyst — ปรับขนาดหน้าต่าง ใช้ลูกศรกับตัวเลขบนคีย์บอร์ด และ ⌘Z ย้อนกลับ ทำงานตามที่คุณคาดหวังทุกอย่าง เริ่มไขปริศนาบนมือถือระหว่างนั่งรถไฟ แล้วไปไขต่อบน Mac ที่โต๊ะทำงาน

  เรื่องความเป็นส่วนตัว พูดตรง ๆ

  เราไม่มี analytics ของเราเอง—ฝั่งเราไม่สร้างโปรไฟล์ของคุณ เซฟของคุณอยู่ใน iCloud Private Database ของตัวคุณเอง คุณเห็นได้ เราเห็นไม่ได้ คะแนน Game Center ส่งผ่าน Apple SDK ของบุคคลที่สามมีเพียงไลบรารีแบนเนอร์โฆษณาของ Google เมื่อคุณอนุญาต อาจใช้ตัวระบุโฆษณาเพื่อให้โฆษณายังตรงกับคุณ—ปฏิเสธได้ โฆษณายังแสดงอยู่เพียงแต่ตรงกับคุณน้อยลง หรือลบแบนเนอร์ออกถาวรด้วยการซื้อในแอปครั้งเดียว

  ลบโฆษณา

  ซื้อครั้งเดียว ไม่มีการสมัครสมาชิก ลบแบนเนอร์ทุกที่อย่างถาวร รองรับ Family Sharing

  เจ็ดภาษา ทำอย่างจริงจัง

  จีนตัวเต็ม อังกฤษ จีนตัวย่อ ญี่ปุ่น เกาหลี สเปน และไทย — ครอบคลุมอินเทอร์เฟซ Game Center และหน้าสโตร์นี้ ทั้งหมด

  ออกแบบมาให้ใช้งานได้จริง

  Dynamic Type ครอบคลุม VoiceOver เต็มรูปแบบ โหมดสว่างและมืด และโทนสีเซจกรีนกับกระดาษอุ่นที่มองได้นาน ๆ แบบไม่ล้า

  ต้องใช้ iOS 26 หรือ macOS 26 ขึ้นไป
