name: "マインスイーパ — クラシック"
subtitle: "iPhoneとMacの静かな論理"
promotional_text: |-
  最初のタップは必ず安全——初手で負けることはもうない。初級・中級・上級。自社のプロファイリングなし。広告はあなたの許可があるときだけ関連性を保ち、拒否も削除もできます。
description: |-
  マインスイーパを、自分のペースで。

  ルールはご存じのとおり——でも最初の一手は必ず安全だから、初手で負けることはない。毎晩、新しい3枚の盤面が届く——初級・中級・上級、世界中で同じ3枚。自分のペースで解けばいい。リーダーボードは、比べたければそこにあるし、興味がなければ気にしなくていい。

  時計を完全に忘れたい？クラシックな3段階はいつでも遊べる。難易度を選んで新しい盤面を1枚——提出するものは何もなく、誰かに証明する必要もない。ただ盤面と向き合うだけ。

  マインスイーパと過ごす一日

  • Daily：3つの難易度、UTC 00:00にリセットされるリーダーボード、1盤面1回の計測。
  • クラシック：初級（9×9、地雷10個）・中級（16×16、40個）・上級（16×30、99個）、いつでも、スコアなしで。
  • 初手の安全：最初にタップしたマスとその周囲は、絶対に地雷ではない。
  • タップで開く、長押しで旗（Macでは右クリックまたはcontrolクリック）。
  • 続きから、そのまま——自動セーブ、ホーム画面も覚えている。
  • Game Centerの実績11個とデイリーリーダーボード3つ。集めたい人向け。

  ひとつのアプリ、本当の意味で二つのプラットフォーム

  同じコード、同じ丁寧さで、両方作った。Mac版はSwiftUIで書かれた本物のMacアプリ——iPad-on-Macでも、Catalystでもない。ウィンドウのリサイズも右クリックでの旗立ても、すべて期待どおりに動く。電車の中でスマホから始めて、机に着いたらMacで続きを解く。

  プライバシーについて、正直に

  自社のアナリティクスもCRMもバックエンドもない——こちら側があなたのプロファイルを作ることはない。データは自分のiCloudプライベートデータベースにあり、見えるのは本人だけ。サードパーティのSDKはGoogleのバナー広告ライブラリのみ。あなたの許可があるときだけ、広告の関連性を保つために広告識別子を使うことがある——拒否すれば広告は表示されたまま（ただし関連性は下がる）、または1回のアプリ内課金でバナーを完全に削除できる。

  広告を非表示

  買い切り、サブスクではない。すべてのバナーを永久に削除。ファミリー共有対応。

  7言語、きちんと対応

  繁体字中国語、英語、簡体字中国語、日本語、韓国語、スペイン語、タイ語——UI、Game Center、このストアページ、すべて。

  使われるために作った

  Dynamic Type、VoiceOverフル対応、ライト／ダークモード、長く座っていても疲れないセージグリーンと暖かい紙色のパレット。

  iOS 26 / macOS 26 以降が必要。
