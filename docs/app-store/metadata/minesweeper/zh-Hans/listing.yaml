name: "扫雷 — 经典"
subtitle: "iPhone 与 Mac 的干净逻辑"
promotional_text: |-
  第一下永远安全——不会再开局就炸。初级、中级、专家三种难度。我们不做第一方画像；广告只在你同意下保持相关性——可拒绝，也可一次购买永久移除。
description: |-
  扫雷，留一点时间给自己。玩法你早就会，但第一步永远安全——不会一开局就踩到雷。

  内容

  • 三种经典难度：初级、中级、专家。
  • 第一下安全：开局那下不会爆。
  • 点一下翻开，长按标记（Mac 上用右键或 control 点击）。
  • Daily 模式：每天三个难度各一题，UTC 00:00 重置的每日排行榜。
  • 三条 Game Center 每日排行榜（初级／中级／专家）。登录可选。

  真正的跨平台

  一份代码，两个平台。Mac 版本是货真价实的 SwiftUI Mac App——不是 iPad-on-Mac、也不是 Catalyst。窗口缩放、右键标记，都照 Mac 用户的习惯走。手边哪台设备在线，就在那台玩。

  关于隐私

  不做第一方 analytics、没有 CRM、没有自己的后端——我们这边不会建立关于你的画像。你的数据放在你自己的 iCloud Private Database，你看得到，我们看不到。唯一的第三方 SDK 是 Google 的横幅广告库；在你同意之下，它可能会使用广告标识符让广告保持相关性——你可以拒绝，广告仍会显示，只是不那么贴近你，也可以用一次购买把横幅永久移除。

  移除广告

  一次性、非消耗型内购，永久移除所有横幅。含家庭共享。

  七种语言

  繁体中文、英文、日文、简体中文、西班牙文、泰文、韩文。

  无障碍

  支持 Dynamic Type、VoiceOver、亮暗模式。

  需要 iOS 26 或 macOS 26 以上。
