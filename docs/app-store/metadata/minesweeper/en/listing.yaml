promotional_text: |-
  First tap always safe — no more losing on move one. Beginner, Intermediate, Expert. We don't profile you; ads tailor only with your OK — decline or remove.
description: |-
  Minesweeper, the unhurried way.

  The rules you already know — but the first tap is always safe, so you never lose on move one. Every midnight, three new boards arrive — Beginner, Intermediate, Expert, the same three for the whole world. Clear them at your pace; the leaderboard is there if you want to know how you compared, and easy to ignore if you don't.

  Want to skip the clock entirely? Play any of the three classic difficulties any time. Pick one, get a fresh board, and there's nothing to submit, nothing to live up to — just you and the mines.

  A day with Minesweeper

  • Daily — three difficulties, a leaderboard that resets at midnight UTC, one scoring attempt per board.
  • Classic — Beginner (9×9, 10 mines), Intermediate (16×16, 40 mines), Expert (16×30, 99 mines), any time, no scores.
  • First-click safety — the opening tap, and its neighbors, can never hold a mine.
  • Tap to reveal, long-press to flag — right-click or control-click on Mac.
  • Pick up exactly where you left off — saves are automatic, and the home screen remembers.
  • Eleven Game Center achievements and three daily leaderboards, if you're into that.

  One app, genuinely two platforms

  Same codebase, same care, on both. The Mac version is a real SwiftUI Mac app — not iPad-on-Mac, not Catalyst — so window resizing and right-click flagging both work the way you'd expect. Start a board on your phone on the train, finish it on your Mac at your desk.

  On privacy, plainly

  No first-party analytics. No CRM. No backend of our own — nothing of ours profiles you. Your data lives in your own iCloud Private Database, visible to you, not to us. The one third-party SDK is Google's banner-ad library; with your permission, it may use an advertising identifier to keep ads relevant — decline and ads still show, just less tailored, or remove the banner for good with a single purchase.

  Remove Ads

  A one-time purchase, no subscription. Removes the banner everywhere, permanently, with Family Sharing included.

  Seven languages, properly done

  English, Traditional Chinese, Simplified Chinese, Japanese, Korean, Spanish, and Thai — the interface, Game Center, and this listing, all of it.

  Built to be used

  Dynamic Type, full VoiceOver support, light and dark mode, and a sage-and-warm-paper palette that's easy to sit with for a while.

  Requires iOS 26 or macOS 26.
