name: "数独 — 每日与练习"
subtitle: "iPhone 与 Mac 的安静逻辑"
promotional_text: |-
  每天 UTC 00:00 三道新题（简单／中等／困难）。iPhone、Mac 同一个 iCloud 账号自动接续进度。广告？一次购买即可永久移除。
description: |-
  数独，留一点时间给自己。

  每天午夜，三道新题准时出现——简单、中等、困难，全球玩家拿到的都一样。照自己的步调解，排行榜想看就看，不看也没关系。

  想完全甩开时钟？切到 Practice。挑个难度、拿一块新题，没有要交的东西，也没有要对得起谁——就你和格子。

  跟数独一起的一天

  • Daily：三种难度、UTC 00:00 重置的排行榜、同一题只有一次计分机会。
  • Practice：想抽多少新题就抽多少，不计分，没压力。
  • 铅笔笔记：每格最多九个候选数字，跟纸笔写法一样。
  • 填错的当下就抓出来，不用等到整盘填完才发现。
  • 二十步 Undo，猜错一次不代表这盘就毁了。
  • 接着上次的地方继续——自动存档，首页也记得。
  • 十一个 Game Center 成就、三条每日排行榜，喜欢收集的话。

  横幅广告可以一次买断移除，没有订阅。手机上开始的那一题，回到 Mac 接着解完。
keywords: "sudoku,益智,逻辑,推理,脑力,离线,ipad,mac,笔记,数字游戏,解谜,填数字,九宫格,数独游戏,数字逻辑,每日,连续"
whats_new: |-
  版本 2.6

  每日挑战、排行榜、成就——以及比以前更安静。

  • Daily 模式 —— 每天 UTC 00:00 三道新题（简单／中等／困难），全球玩家同题。
  • Game Center —— 三条每日排行榜与八个成就，共 500 点。登录可选。
  • 随时接续 —— 自动存档，首页一键继续。
  • 移除广告 —— 一次性、非消耗型内购，永久移除横幅。含家庭共享。

  隐私维持它该有的样子：不做第一方 analytics，广告只在你同意下才会贴近你——也可以拒绝，或一次购买移除。

  谢谢游玩。问题与建议欢迎到支持链接反馈。
