name: "数独 — デイリーと練習"
subtitle: "iPhoneとMacの静かな論理"
promotional_text: |-
  毎日UTC 00:00に3つの新しいパズル（簡単・中級・上級）。iPhoneとMacで同じiCloudアカウントなら進行状況を自動で引き継ぐ。広告は？一回の購入で永久に消せます。
description: |-
  数独を、自分のペースで。

  毎晩、新しい3問が届く——やさしい・ふつう・むずかしい、世界中で同じ3問。自分の速さで解けばいい。リーダーボードは、比べたければそこにあるし、興味がなければ気にしなくていい。

  時計を完全に忘れたい？Practiceに切り替えよう。難易度を選んで新しい盤面を1枚——提出するものは何もなく、誰かに証明する必要もない。ただ盤面と向き合うだけ。

  数独と過ごす一日

  • Daily：3つの難易度、UTC 00:00にリセットされるリーダーボード、1問1回の計測。
  • Practice：好きなだけ新しい盤面を。スコアなし、プレッシャーなし。
  • メモ機能：1マスに最大9個の候補。紙にエンピツで書く感覚そのまま。
  • 間違いはその場でわかる。最後まで気づかない事故が起きない。
  • Undoは20手分。ひとつのミスで盤面が台無しになることはない。
  • 続きから、そのまま——自動セーブ、ホーム画面も覚えている。
  • Game Centerの実績11個とデイリーリーダーボード3つ。集めたい人向け。

  バナー広告は一回の買い切りで削除できます——サブスクではありません。スマホで始めたパズルは、Macでも続きから解けます。
keywords: "ナンプレ,sudoku,デイリー,パズル,論理,脳トレ,オフライン,ipad,mac,メモ,数字パズル,脳トレゲーム,数独ゲーム,ナンバープレース,数字,連続"
whats_new: |-
  バージョン2.6

  デイリーパズル、リーダーボード、実績——そしてさらに静かに。

  • Dailyモード —— 毎日UTC 00:00に新しい3問（簡単・中級・上級）、全世界で同じ問題。
  • Game Center —— 3つのデイリーリーダーボードと11個の実績。サインイン任意。
  • いつでも再開 —— 自動セーブ。ホームから1タップで続きから。
  • 広告を非表示 —— 非消耗型の1回購入でバナーを永久削除。ファミリー共有対応。

  プライバシーはあるべき形のまま。自社のアナリティクスは持たない。広告はあなたの許可があるときだけ関連性を保つ——拒否もできる。

  遊んでくれてありがとう。問題や要望はサポートリンクから。
