whats_new: |-
  版本 2.6

  每日挑戰、排行榜、成就——以及比以前更安靜。

  • Daily 模式 —— 每天 UTC 00:00 三道新題（簡單／中等／困難），全球玩家同題。
  • Game Center —— 三條每日排行榜與八個成就，共 500 點。登入可選。
  • 隨時接續 —— 自動存檔，首頁一鍵繼續。
  • 移除廣告 —— 一次性、非消耗型內購，永久移除橫幅。含家庭共享。

  隱私維持它該有的樣子：不做第一方 analytics，廣告只在你同意下才會貼近你——也可以拒絕，或一次購買移除。

  謝謝遊玩。問題與建議歡迎到支援連結回報。
