name: "踩地雷 — 經典"
subtitle: "iPhone 與 Mac 的乾淨邏輯"
promotional_text: |-
  第一下永遠安全——不會再開局就爆。初級、中級、專家三種難度。廣告一次購買即可永久移除。
description: |-
  踩地雷，留一點時間給自己。

  玩法你早就會——但第一步永遠安全，不會一開局就踩到雷。每天午夜，三塊新地圖準時出現——初級、中級、專家，全球玩家拿到的都一樣。照自己的步調掃，排行榜想看就看，不看也沒關係。

  想完全甩開時鐘？三種經典難度隨時都能玩。挑一個、拿一塊新地圖，沒有要交的東西，也沒有要對得起誰——就你和地雷。

  跟踩地雷一起的一天

  • Daily：三種難度、UTC 00:00 重置的排行榜、同一塊地圖只有一次計分機會。
  • 經典模式：初級（9×9，10 顆雷）、中級（16×16，40 顆雷）、專家（16×30，99 顆雷），隨時開玩，不計分。
  • 第一步保證安全：開局那格連同周圍格子，絕不會是雷。
  • 點一下翻開，長按標記——Mac 上用右鍵或 control 點擊。
  • 接著上次的地方繼續——自動存檔，首頁也記得。
  • 十一個 Game Center 成就、三條每日排行榜，喜歡收集的話。

  橫幅廣告可以一次買斷移除，沒有訂閱。手機上開始的那一局，回到 Mac 接著掃完。
keywords: "掃雷,地雷,邏輯,益智,經典,動腦,離線,ipad,mac,標記,數字,掃雷遊戲,挖地雷,炸彈,踩雷,踩地雷遊戲"
whats_new: |-
  版本 1.0

  首次發布。

  • 經典踩地雷：初級、中級、專家。第一下永遠安全。
  • Daily 模式：每天 UTC 00:00 三題，附 Game Center 排行榜。
  • 移除廣告：一次性、非消耗型內購，永久移除橫幅。含家庭共享。
  • iCloud 同步：資料放在你自己的 iCloud Private Database。
  • 七種語言：繁中、英、日、簡中、西、泰、韓。
  • Mac 原生，不是 Catalyst。

  謝謝遊玩。問題與建議歡迎到支援連結回報。
