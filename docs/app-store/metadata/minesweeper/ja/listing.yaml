  • デイリーモード：毎日UTC 00:00に3問、Game Centerリーダーボード付き。
  • 広告を非表示：非消耗型の1回購入でバナーを永久削除。ファミリー共有対応。
  • iCloud同期：データは自分のiCloudプライベートデータベースに。
  • 7言語対応：日本語、英語、繁体字、簡体字、スペイン語、タイ語、韓国語。
  • Macネイティブ。Catalystではない。

