name: "지뢰찾기 — 클래식"
subtitle: "iPhone과 Mac을 위한 깔끔한 논리"
promotional_text: |-
  첫 탭은 언제나 안전해요——첫 수에 지는 일은 이제 없어요. 초급, 중급, 전문가. 광고요? 한 번 구매로 영구히 없앨 수 있어요.
description: |-
  지뢰찾기, 서두르지 않는 방식으로.

  이미 아는 규칙이에요 — 하지만 첫 수는 언제나 안전해서, 첫 수에 지는 일은 없어요. 매일 자정, 새로운 세 개의 보드가 도착합니다 — 초급, 중급, 전문가, 전 세계가 똑같은 세 개. 당신의 속도로 클리어하면 됩니다. 다른 사람과 비교하고 싶다면 리더보드가 있고, 관심 없다면 무시해도 좋습니다.

  시계를 아예 잊고 싶다면? 클래식한 세 가지 난이도는 언제든 플레이할 수 있어요. 하나 고르고 새 보드를 받으면, 제출할 것도 증명할 것도 없어요 — 그냥 당신과 지뢰뿐이에요.

  지뢰찾기와 함께하는 하루

  • Daily: 세 가지 난이도, UTC 00:00에 리셋되는 리더보드, 같은 보드는 한 번만 점수에 반영돼요.
  • 클래식: 초급(9×9, 지뢰 10개), 중급(16×16, 40개), 전문가(16×30, 99개), 언제든, 점수 없이.
  • 첫 탭 안전: 첫 번째로 연 칸과 그 주변은 절대 지뢰가 아니에요.
  • 탭으로 열고, 길게 눌러 깃발 — Mac에서는 오른쪽 클릭 또는 control 클릭.
  • 멈춘 곳에서 그대로 이어서 — 자동 저장되고, 홈 화면도 기억해요.
  • Game Center 도전 과제 열한 개와 데일리 리더보드 세 개. 관심 있다면요.

  배너 광고는 한 번의 구매로 없앨 수 있어요 — 구독 아니에요. 폰에서 시작한 보드를 Mac에서 이어서 클리어할 수 있어요.
keywords: "지뢰,논리,퍼즐,클래식,두뇌,오프라인,ipad,mac,깃발,숫자,논리퍼즐,마인스위퍼,폭탄,지뢰게임,클래식게임"
whats_new: |-
  버전 1.0

  첫 출시예요.

  • 클래식 지뢰찾기: 초급, 중급, 전문가. 첫 탭은 언제나 안전해요.
  • Daily 모드: 매일 UTC 00:00에 세 문제, Game Center 리더보드 포함.
  • 광고 제거: 비소모성 일회성 구매로 배너를 영구히 없애요. 가족 공유 지원.
  • iCloud 동기화: 데이터는 본인의 iCloud 개인 데이터베이스에 있어요.
  • 일곱 가지 언어: 영어, 번체 중국어, 일본어, 간체 중국어, 스페인어, 태국어, 한국어.
  • Mac 네이티브, Catalyst 아니에요.

  플레이해 주셔서 고마워요. 문제나 제안은 지원 링크로 보내 주세요.
