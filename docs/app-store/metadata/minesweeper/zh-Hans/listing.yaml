name: "扫雷 — 经典"
subtitle: "iPhone 与 Mac 的干净逻辑"
promotional_text: |-
  第一下永远安全——不会再开局就炸。初级、中级、专家三种难度。我们不做第一方画像；广告只在你同意下保持相关性——可拒绝，也可一次购买永久移除。
description: |-
  扫雷，留一点时间给自己。

  玩法你早就会——但第一步永远安全，不会一开局就踩到雷。每天午夜，三块新地图准时出现——初级、中级、专家，全球玩家拿到的都一样。照自己的步调扫，排行榜想看就看，不看也没关系。

  想完全甩开时钟？三种经典难度随时都能玩。挑一个、拿一块新地图，没有要交的东西，也没有要对得起谁——就你和地雷。

  跟扫雷一起的一天

  • Daily：三种难度、UTC 00:00 重置的排行榜、同一块地图只有一次计分机会。
  • 经典模式：初级（9×9，10 颗雷）、中级（16×16，40 颗雷）、专家（16×30，99 颗雷），随时开玩，不计分。
  • 第一步保证安全：开局那格连同周围格子，绝不会是雷。
  • 点一下翻开，长按标记——Mac 上用右键或 control 点击。
  • 接着上次的地方继续——自动存档，首页也记得。
  • 十一个 Game Center 成就、三条每日排行榜，喜欢收集的话。

  一个 App，真正的两个平台

  同一份代码，同样用心做，两边都是。Mac 版本是货真价实的 SwiftUI Mac App——不是 iPad-on-Mac，也不是 Catalyst——所以窗口缩放、右键标记，全都照你的预期运作。在地铁上用手机开了头，回到书桌用 Mac 接着扫完。

  关于隐私，说白了

  不做第一方 analytics、没有 CRM、没有自己的后端——我们这边不会建立关于你的画像。你的数据放在你自己的 iCloud Private Database，你看得到，我们看不到。唯一的第三方 SDK 是 Google 的横幅广告库；在你同意之下，它可能会使用广告标识符让广告保持相关性——你可以拒绝，广告仍会显示，只是不那么贴近你，也可以用一次购买把横幅永久移除。

  移除广告

  一次性购买，没有订阅。永久移除所有横幅，含家庭共享。

  七种语言，认真做好

  繁体中文、英文、简体中文、日文、韩文、西班牙文、泰文——界面、Game Center、这份商店页面，全都是。

  用得住，才是重点

  Dynamic Type、完整 VoiceOver、明暗模式，还有能让你久待也不腻的 sage 绿与暖纸色调。

  需要 iOS 26 或 macOS 26 以上。
