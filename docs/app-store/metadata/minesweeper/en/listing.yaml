whats_new: |-
  Version 1.0

  First release.

  • Classic Minesweeper — Beginner, Intermediate, Expert. First tap is always safe.
  • Daily mode — three puzzles every day at midnight UTC, with Game Center leaderboards.
  • Remove Ads — a one-time, non-consumable purchase removes the banner everywhere, forever.
  • iCloud sync — game data lives in your own iCloud Private Database.
  • Seven languages: English, Traditional Chinese, Japanese, Simplified Chinese, Spanish, Thai, Korean.
  • Mac native — not Catalyst.

  Thank you for playing. Issues and feature requests are welcome at the support link.
