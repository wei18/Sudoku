name: "扫雷 — 经典"
subtitle: "iPhone 与 Mac 的干净逻辑"
promotional_text: |-
  第一下永远安全——不会再开局就炸。初级、中级、专家三种难度。广告？一次购买即可永久移除。
description: |-
  扫雷，留一点时间给自己。

  玩法你早就会——但第一步永远安全，不会一开局就踩到雷。每天午夜，三块新地图准时出现——初级、中级、专家，全球玩家拿到的都一样。照自己的步调扫，排行榜想看就看，不看也没关系。

  想完全甩开时钟？三种经典难度随时都能玩。挑一个、拿一块新地图，没有要交的东西，也没有要对得起谁——就你和地雷。

  跟扫雷一起的一天

  • Daily：三种难度、UTC 00:00 重置的排行榜、同一块地图只有一次计分机会。
  • 经典模式：初级（9×9，10 颗雷）、中级（16×16，40 颗雷）、专家（16×30，99 颗雷），随时开玩，不计分。
  • 第一步保证安全：开局那格连同周围格子，绝不会是雷。
  • 点一下翻开，长按标记——Mac 上用右键或 control 点击。
  • 接着上次的地方继续——自动存档，首页也记得。
  • 十一个 Game Center 成就、三条每日排行榜，喜欢收集的话。

  横幅广告可以一次买断移除，没有订阅。手机上开始的那一局，回到 Mac 接着扫完。
keywords: "地雷,逻辑,益智,经典,动脑,离线,ipad,mac,标记,数字,扫雷游戏,挖地雷,炸弹,踩雷,踩地雷,扫地雷"
whats_new: |-
  版本 1.0

  首次发布。

  • 经典扫雷：初级、中级、专家。第一下永远安全。
  • Daily 模式：每天 UTC 00:00 三题，附 Game Center 排行榜。
  • 移除广告：一次性、非消耗型内购，永久移除横幅。含家庭共享。
  • iCloud 同步：数据放在你自己的 iCloud Private Database。
  • 七种语言：繁中、英、日、简中、西、泰、韩。
  • Mac 原生，不是 Catalyst。

  谢谢游玩。问题与建议欢迎到支持链接反馈。
