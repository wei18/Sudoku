description: |-
  Buscaminas, sin prisas.

  Las reglas que ya conoces — pero el primer toque siempre es seguro, así que nunca pierdes en la primera jugada. Cada medianoche llegan tres tableros nuevos — Principiante, Intermedio, Experto, los mismos para todo el mundo. Despeja a tu ritmo; el ranking está ahí si quieres saber cómo te comparas, y es fácil de ignorar si no.

  ¿Quieres olvidarte del reloj por completo? Juega cualquiera de las tres dificultades clásicas cuando quieras. Elige una, recibe un tablero nuevo, y no hay nada que enviar ni nada que demostrar — solo tú y las minas.

  Un día con Buscaminas

  • Diario: tres dificultades, un ranking que se reinicia a medianoche UTC, una sola puntuación por tablero.
  • Clásico: Principiante (9×9, 10 minas), Intermedio (16×16, 40 minas), Experto (16×30, 99 minas), cuando quieras, sin puntuaciones.
  • Seguridad en el primer toque: la celda inicial, y sus vecinas, nunca pueden tener una mina.
  • Toca para revelar, mantén pulsado para marcar — clic derecho o control-clic en Mac.
  • Retoma justo donde lo dejaste — el guardado es automático y la pantalla principal lo recuerda.
  • Once logros de Game Center y tres rankings diarios, si te va ese rollo.

  Una sola app, de verdad dos plataformas

  Mismo código, el mismo cuidado, en ambas. La versión de Mac es una app SwiftUI nativa real — no es iPad en Mac ni Catalyst — así que redimensionar ventanas y marcar con clic derecho funcionan tal como esperas. Empieza un tablero en el móvil durante el trayecto, termínalo en el Mac en tu escritorio.

  Privacidad, sin rodeos

  Sin analítica propia. Sin CRM. Sin servidor propio: nada nuestro te perfila. Tus datos están en tu propia base de datos privada de iCloud, visibles para ti, no para nosotros. El único SDK de terceros es la biblioteca de banners de Google; con tu permiso, puede usar un identificador de publicidad para mantener los anuncios relevantes — recházalo y los anuncios seguirán apareciendo, solo que menos personalizados, o quita el banner para siempre con una sola compra.

  Quitar anuncios

  Una compra única, sin suscripción. Quita el banner en todas partes, para siempre, con Compartir en Familia incluido.

  Siete idiomas, hechos como es debido

  Inglés, chino tradicional, chino simplificado, japonés, coreano, español y tailandés — la interfaz, Game Center y esta ficha, todo.

  Pensada para el día a día

  Dynamic Type, soporte completo de VoiceOver, modo claro y oscuro, y una paleta verde salvia y papel cálido fácil de mirar durante ratos largos.

  Requiere iOS 26 o macOS 26.
