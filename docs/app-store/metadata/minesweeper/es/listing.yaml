  • Sincronización iCloud: tus datos viven en tu propia base de datos privada de iCloud.
  • Siete idiomas: inglés, chino tradicional, japonés, chino simplificado, español, tailandés, coreano.
  • Mac nativo, no Catalyst.

  Gracias por jugar. Las incidencias y sugerencias son bienvenidas en el enlace de soporte.
