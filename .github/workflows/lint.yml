# Consolidated lint workflow — 6 jobs:
#   1. pr-metadata   — Conventional Commits PR title (ubuntu, no source)
#   2. docs-link-check — lychee scan of docs/ + meetings/ (ubuntu, no source)
#   3. swift-lint    — swiftlint + swiftformat on changed Swift files (macos)
#   4. l10n          — L10n catalog completeness gate (ubuntu, no source)
#   5. settings-root — Settings.bundle Root.plist sync gate (ubuntu, no source)
#   6. frame-drift-gate — ASC marketing-frame drift proxy gate (ubuntu, #1001)
#
# Workflow-level path filter is omitted so the workflow always runs and each
# job's own `if:` (or path-aware logic) decides whether to do work; this keeps
# the required-status-check setup simple — one workflow name, six job
# names — once branch protection lands (user-owned).

name: Lint

on:
  pull_request:
    # labeled/unlabeled: frame-drift-gate's escape hatch is the PR label
    # 'frame-drift-verified' — without these two types, adding the label
    # would not re-run the check and could never turn a red gate green.
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-metadata:
    name: Validate PR title (Conventional Commits)
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Conventional Commits types accepted in this repo (matches recent
          # merged commit history: feat, refactor, fix, docs, chore, ci, ...).
          types: |
            feat
            fix
            docs
            chore
            refactor
            test
            build
            ci
            perf
            style
            revert
          # Scopes optional + unrestricted (e.g. `feat(monetization):`).
          requireScope: false
          # Subject must not start with an UPPERCASE letter (Conventional-Commits
          # lowercase style). A leading digit IS allowed so subjects like
          # "3×3 keypad" / "44pt tap target" pass without contortion.
          subjectPattern: ^[a-z0-9].+$
          subjectPatternError: |
            The subject "{subject}" found in the pull request title "{title}"
            must start with a lowercase letter or a digit (not an uppercase
            letter) — e.g. "feat(scope): add foo bar" or "fix(ui): 44pt target".

  docs-link-check:
    name: Markdown link check (lychee)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: List changed markdown files via gh api
        id: changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          files=$(gh api \
            "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --paginate \
            --jq '.[] | select(.filename | startswith("docs/") or startswith("meetings/")) | select(.filename | endswith(".md")) | .filename' \
            | tr '\n' ' ')
          echo "files=$files" >> "$GITHUB_OUTPUT"
          if [ -z "$files" ]; then
            echo "No relevant markdown files changed; lychee will be skipped."
          else
            echo "Changed markdown files: $files"
          fi

      - name: Check markdown links
        if: steps.changed.outputs.files != ''
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-concurrency 4
            ${{ steps.changed.outputs.files }}
          fail: true
          # A markdown change with zero links is not a failure mode — lychee's
          # default failIfEmpty=true blocks legit no-link doc edits (e.g.
          # docs/methodology.md contains no URLs). Only real broken links
          # should fail the job; absence of links should not.
          failIfEmpty: false

  swift-lint:
    name: SwiftLint (changed files)
    # ubuntu-latest: swiftlint ships a linux x86_64 binary via mise (no Swift
    # toolchain needed for lint-only). swiftformat removed 2026-05-26 (user
    # decision: swiftlint coverage sufficient; swiftformat is redundant).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mise + pinned tools
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: List changed Swift files via gh api
        id: changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          files=$(gh api \
            "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --paginate \
            --jq '.[] | select(.filename | endswith(".swift")) | .filename' \
            | tr '\n' ' ')
          echo "files=$files" >> "$GITHUB_OUTPUT"
          if [ -z "$files" ]; then
            echo "No Swift files changed; swift-lint will be skipped."
          else
            echo "Changed Swift files: $files"
          fi

      - name: SwiftLint on changed files
        if: steps.changed.outputs.files != ''
        # Invocation routes through `mise run lint:swift_strict` — SSOT task
        # body in mise-tasks/lint/swift_strict. Strict variant fails on warnings
        # (vs lefthook's warn-only `lint:swift`).
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          mise run lint:swift_strict -- ${{ steps.changed.outputs.files }}

  l10n:
    name: L10n catalogs complete (no <TRANSLATE>, all 7 locales)
    # Guards both shipping catalogs (Sudoku + Minesweeper) and the
    # SudokuAppCompositionTests fixture sync. Reads the real source tree, so it
    # catches placeholders the Xcode Cloud distributed test runner can't.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mise + pinned tools
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Run L10n completeness gate
        run: mise run scan:l10n

  settings-root:
    name: Settings.bundle Root.plist sync (single-sourced #832)
    # Catches a per-app Root.plist hand-edited and committed without
    # regenerating via `mise run gen:settings_root` (#837). Pure `cmp`, no
    # macOS-only tooling needed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mise + pinned tools
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Run Settings.bundle Root.plist sync gate
        run: mise run scan:settings_root

  frame-drift-gate:
    name: ASC frame drift proxy gate (#1001)
    # Catches #995/#998: a snapshot baseline that FEEDS a Slot() in
    # scripts/build-ascspec-screenshots.py changes, but no file under
    # docs/app-store/screenshots-ascspec/ changes in the same PR — i.e. a
    # baseline moved and the marketing frames weren't regenerated to match.
    #
    # This is a proxy, not the real regenerate-and-diff check: the generator
    # loads macOS system fonts by absolute path (Hiragino Sans GB / PingFang /
    # AppleSDGothicNeo / Ayuthaya — see the script's own header comment) and
    # cannot run on ubuntu-latest at all, so `python3
    # scripts/build-ascspec-screenshots.py && git diff --exit-code` isn't an
    # option on this fleet. This job is pure git/grep — no Python, no
    # Pillow, no fonts — and only fires on baselines the SLOTS table actually
    # maps to a store frame (most __Snapshots__ baselines feed no frame at
    # all; firing on all of them would be noise nobody would keep enabled).
    #
    # fetch-depth: 0 — the gate needs full history to compute the merge-base
    # with the PR's base branch (git diff proxy_base...HEAD) and to scan
    # commit trailers for the escape hatch.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install mise + pinned tools
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Run ASC frame drift proxy gate
        env:
          # Escape hatch (documented in the gate's own failure message): a PR
          # label acknowledging that a baseline change genuinely doesn't
          # alter any ASC frame. The alternate form is a `Frame-Drift-Verified:`
          # commit-message trailer, checked directly from git log inside the
          # task (no env var needed for that path).
          FRAME_DRIFT_LABEL_OVERRIDE: ${{ contains(github.event.pull_request.labels.*.name, 'frame-drift-verified') && '1' || '0' }}
        run: mise run scan:store_frame_drift --base "origin/${{ github.event.pull_request.base.ref }}"

      # Sibling gate (#1021): the drift gate above only fires when a MAPPED
      # baseline CHANGES. It is blind to a baseline whose recording test was
      # renamed or deleted — the PNG stays on disk, `swift test` stays green,
      # and both store pipelines keep compositing frozen pre-rewrite pixels.
      # It is equally blind to a slot naming a file that no longer exists.
      # This check is state-based (no base ref, no history needed).
      - name: Run store-baseline orphan gate
        run: mise run scan:store_baseline_orphans
