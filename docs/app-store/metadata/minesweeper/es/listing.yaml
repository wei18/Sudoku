description: |-
  Buscaminas, sin prisas.

  Las reglas que ya conoces — pero el primer toque siempre es seguro, así que nunca pierdes en la primera jugada. Cada medianoche llegan tres tableros nuevos — Principiante, Intermedio, Experto, los mismos para todo el mundo. Despeja a tu ritmo; el ranking está ahí si quieres saber cómo te comparas, y es fácil de ignorar si no.

  ¿Quieres olvidarte del reloj por completo? Juega cualquiera de las tres dificultades clásicas cuando quieras. Elige una, recibe un tablero nuevo, y no hay nada que enviar ni nada que demostrar — solo tú y las minas.

  Un día con Buscaminas

  • Diario: tres dificultades, un ranking que se reinicia a medianoche UTC, una sola puntuación por tablero.
  • Clásico: Principiante (9×9, 10 minas), Intermedio (16×16, 40 minas), Experto (16×30, 99 minas), cuando quieras, sin puntuaciones.
  • Seguridad en el primer toque: la celda inicial, y sus vecinas, nunca pueden tener una mina.
  • Toca para revelar, mantén pulsado para marcar — clic derecho o control-clic en Mac.
  • Retoma justo donde lo dejaste — el guardado es automático y la pantalla principal lo recuerda.
  • Once logros de Game Center y tres rankings diarios, si te va ese rollo.

  El banner se puede quitar con una sola compra única — sin suscripción. Y el tablero que empiezas en tu móvil te espera en el Mac.
