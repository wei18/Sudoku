name: "マインスイーパ — クラシック"
subtitle: "iPhoneとMacの静かな論理"
promotional_text: |-
  最初のタップは必ず安全——初手で負けることはもうない。初級・中級・上級。自社のプロファイリングなし。広告はあなたの許可があるときだけ関連性を保ち、拒否も削除もできます。
description: |-
  マインスイーパを、自分のペースで。ルールはご存じのとおり——でも最初の一手は必ず安全だから、初手で負けることはない。

  内容

  • クラシックな3段階：初級・中級・上級。
  • 初手の安全：最初のタップで負けない。
  • タップで開く、長押しで旗（Macでは右クリックまたはcontrolクリック）。
  • デイリーモード：毎日3難度、UTC 00:00リセットのリーダーボード付き。
  • Game Centerデイリーリーダーボード3つ（初級・中級・上級）。サインイン任意。

  真のクロスプラットフォーム

  ひとつのコードベース、ふたつのプラットフォーム。Mac版は本物のSwiftUI Macアプリ——iPad-on-MacでもCatalystでもない。ウィンドウのリサイズも右クリックでの旗立ても、Macの作法どおりに動く。手元にあるデバイスでプレイできる。

  プライバシーについて

  自社のアナリティクスもCRMもバックエンドもない——こちら側があなたのプロファイルを作ることはない。データは自分のiCloudプライベートデータベースにあり、見えるのは本人だけ。サードパーティのSDKはGoogleのバナー広告ライブラリのみ。あなたの許可があるときだけ、広告の関連性を保つために広告識別子を使うことがある——拒否すれば広告は表示されたまま（ただし関連性は下がる）、または1回のアプリ内課金でバナーを完全に削除できる。

  広告を非表示

  非消耗型の1回購入で、すべてのバナーを永久に削除。ファミリー共有対応。

  7言語対応

  日本語、英語、繁体字中国語、簡体字中国語、スペイン語、タイ語、韓国語。

  アクセシビリティ

  Dynamic Type、VoiceOver、ライト／ダークモード対応。

  iOS 26またはmacOS 26以降が必要。
