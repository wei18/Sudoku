name: "數獨 — 每日與練習"
subtitle: "iPhone 與 Mac 的安靜邏輯"
promotional_text: |-
  每天 UTC 00:00 三道新題（簡單／中等／困難）。iPhone、Mac 同一個 iCloud 帳號自動接續進度。廣告一次購買即可永久移除。
description: |-
  數獨，留一點時間給自己。

  每天午夜，三道新題準時出現——簡單、中等、困難，全球玩家拿到的都一樣。照自己的步調解，排行榜想看就看，不看也沒關係。

  想完全甩開時鐘？切到 Practice。挑個難度、拿一塊新題，沒有要交的東西，也沒有要對得起誰——就你和格子。

  跟數獨一起的一天

  • Daily：三種難度、UTC 00:00 重置的排行榜、同一題只有一次計分機會。
  • Practice：想抽多少新題就抽多少，不計分，沒壓力。
  • 鉛筆筆記：每格最多九個候選數字，跟紙筆寫法一樣。
  • 填錯的當下就抓出來，不用等到整盤填完才發現。
  • 二十步 Undo，猜錯一次不代表這盤就毀了。
  • 接著上次的地方繼續——自動存檔，首頁也記得。
  • 八個 Game Center 成就、三條每日排行榜，共 500 點，喜歡收集的話。

  橫幅廣告可以一次買斷移除，沒有訂閱。手機上開始的那一題，回到 Mac 接著解完。
